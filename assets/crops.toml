# Crops (milestone 16 part 2, docs/milestones/16-food.md, ADR-0010). Each grows
# from its seed (the first stage block, placed like a prop) through four
# stage blocks; `hours` to ripen with nothing helping (guesses from players'
# reports: tubers 2 to 4 hours, the rest "hours to days"); `farming` the
# Farming level sowing needs (guesses); `ground` what it is sown on;
# `water`: wants water beside it (rice). Yields are Boundless's drop data:
# a seed certain and `seed_extra` a chance of another; `crop_base` the yield
# (whole part certain, the rest a chance) and `crop_extra` a chance of one
# more.

[[crop]]
name = "dewberry"
display = "Dewberry Bush"
stages = ["dewberry_seed", "dewberry_bush_2", "dewberry_bush_3", "dewberry_bush_4"]
yield = "dewberry"
hours = 3.0
farming = 0
ground = ["soil", "turf", "tilled_soil"]
crop_base = 1.0
crop_extra = 0.1

