# Block catalogue. The server loads this file and sends it to every client in the
# handshake, so a client can never disagree with the server about what a block id
# means. Order matters only in that `air` must be first (id 0); every other
# reference to a block is by name.
#
# Fields
#   name        unique, used by worldgen and saves
#   color       base colour, sRGB 0-255 (placeholder until the texture pass)
#   top_color, bottom_color   optional per-face overrides of `color`
#   fringe      sides show a band of the top colour along their upper edge
#   solid       physical: collision, targeting, breaking
#   opaque      visual: hides faces behind it, casts ambient occlusion
#   translucent drawn in the blended pass (water, glass)
#   breakable   false for the world floor
#   placeable   may appear in the build hotbar
#   hardness    seconds to break by hand (0 = instant)
#   opacity     for translucent blocks, how opaque they draw (default 1)
#   light       light given off, 0-15 (default 0)
#   textures    { all = "x" } or any of top / side / bottom; names are files in
#               assets/textures/blocks/ (docs/art-direction.md)

[[block]]
name = "air"
color = [0, 0, 0]
solid = false
opaque = false
translucent = false
breakable = false
placeable = false
hardness = 0.0

