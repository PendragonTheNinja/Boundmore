# Block catalogue. The server loads this file and sends it to every client in the
# handshake, so a client can never disagree with the server about what a block id
# means. Order matters only in that `air` must be first (id 0); every other
# reference to a block is by name.
#
# Fields
#   name        unique, used by worldgen and saves
#   color       base colour, sRGB 0-255 (placeholder until the texture pass)
#   top_color, bottom_color   optional per-face overrides of `color`
#   fringe      sides show a band of the top colour along their upper edge
#   solid       physical: collision, targeting, breaking
#   opaque      visual: hides faces behind it, casts ambient occlusion
#   translucent drawn in the blended pass (water, glass)
#   breakable   false for the world floor
#   placeable   may appear in the build hotbar
#   health      soft (800) | hard (1200, the default) | seam (2400) | plant
#               (800, never armoured: plants, boulders, fungi) | prop (two
#               swings of anything): with the planet's tier, how much damage
#               breaking it takes (bm-core `mining`, tuning 2.2)
#   opacity     for translucent blocks, how opaque they draw (default 1)
#   light       light given off, 0-15 (default 0)
#   textures    { all = "x" } or any of top / side / bottom; names are files in
#               assets/textures/blocks/ (docs/art-direction.md)
#   material    rock | soil | wood | plant | crystal: which tools break it faster
#   drops       the item it yields (default: its own item; "" for nothing)
#   station     crafting_table | workbench | extractor | furnace: a crafting
#               station
#   storage     slots of storage inside (0, the default: none)
#   colourable  takes a palette colour (default true; ADR-0007)
#   chisel      none (default) | slope (natural terrain, as in Boundless) | any
#               which chisels may cut it (ADR-0008)
#   mount       floor | north | east | south | west: a prop (a torch) drawn as
#               a small model, on top of the block below or against the side
#               of its neighbour that way (north = z - 1); not solid
#   assembly    four | furnace_base | furnace_crucible: how a machine's
#               blocks must stand to work (milestone 11)
#   model       torch (default) | plant | boulder | fungus: how a prop draws
#   fuel        heat it gives burnt in a furnace (0: not fuel; tuning 4.7)
#   mine_xp     XP for breaking a natural one (gathering objects: times the
#               tier's health multiplier, a guess); build_xp: XP for placing
#               one inside your own claim (Boundless's per-block data;
#               milestone 12)
#   bonus       extra yields by planet tier 1 to 8, the expected count each:
#               [{ item = "flint", per_tier = [0.015, ...] }] (tuning 4.4)

