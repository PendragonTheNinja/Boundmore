# Planet kinds. A kind is a template: when a planet is created, its
# generation settings are copied from here and saved with the planet, so
# editing this file changes only planets created afterwards.
#
#   name        unique; the server's planet list refers to it
#   display     what players see (default: the name in title case)
#   tier        1 is the gentle start; higher tiers hold rarer ore
#   [kind.look]
#     day_zenith, day_horizon   daytime sky, linear RGB 0-1
#     color                     the planet seen from other planets, linear RGB
#     tints                     [["block", [r, g, b]], ...] multiplies a block's
#                               texture, sRGB 0-255 (white is none)
#   [kind.generation]           PlanetGenConfig fields (bm-worldgen); any left
#                               out keep their defaults

[[kind]]
name = "temperate"
tier = 1
[kind.look]
day_zenith = [0.08, 0.26, 0.78]
day_horizon = [0.42, 0.62, 0.90]
color = [0.30, 0.55, 0.35]

