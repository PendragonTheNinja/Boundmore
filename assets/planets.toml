# Planet kinds. A kind is a template: when a planet is created, its
# generation settings are copied from here and saved with the planet, so
# editing this file changes only planets created afterwards.
#
#   name        unique; the server's planet list refers to it
#   display     what players see (default: the name in title case)
#   tier        1 is the gentle start; higher tiers hold rarer ore
#   [kind.look]
#     day_zenith, day_horizon   daytime sky, linear RGB 0-1
#     color                     the planet seen from other planets, linear RGB
#     tints                     [["block", [r, g, b]], ...] multiplies a block's
#                               texture, sRGB 0-255 (white is none)
#   [kind.colours]              natural colours (ADR-0007): block = [palette
#                               colour names from assets/colours.toml, ...].
#                               Each new planet picks a main colour and one to
#                               three regional variants per block from its
#                               list, by seed, and keeps them. Only colourable
#                               blocks; a block left out stays natural. Adding
#                               a colour here changes only planets created
#                               afterwards.
#   [kind.generation]           PlanetGenConfig fields (bm-worldgen); any left
#                               out keep their defaults, which are the
#                               temperate world:
#     sea_level 128, snow_line 112 (above sea), mountain_height 130.0
#     tree_density 0.012, tree_line 100 (above sea), trunk_min 5, trunk_extra 4
#     water_offset 0          water fills to sea_level + this
#     ice_depth 0             top layers of water frozen to `ice`
#     ground "turf", subsoil "soil", snow "snow", shore "sand",
#     shallows "sand", seabed ["gravel", "sand"], cliff "stone",
#     water "water", ice "ice"
#     layer "sandstone", layer_depth 0    a rock band under the topsoil
#     glow_chance 0.02, glow_depth 24     crystals on cave floors below sea - depth
#     ores   coal_seam and copper_vein (below). Listing [[kind.generation.ores]]
#            replaces the whole list. Each ore's veins come from noise keyed
#            by its place in the list: keep coal first and copper second so
#            they lie where they would on a temperate world, and add new ores
#            at the end.
#       block, size (vein size, blocks), threshold (lower is richer),
#       min_y, max_y (world heights, inclusive), min_depth (below the surface)

[[kind]]
name = "temperate"
tier = 1
# Generation: every default (coal and copper, no iron).
[kind.look]
day_zenith = [0.08, 0.26, 0.78]
day_horizon = [0.42, 0.62, 0.90]
color = [0.30, 0.55, 0.35]
[kind.colours]
turf = ["Rich Moss", "Strong Moss", "Bold Moss", "Dusky Moss", "Rich Fern", "Strong Fern", "Muted Moss", "Rich Lime", "Strong Lime"]
foliage = ["Dusky Fern", "Rich Fern", "Dark Fern", "Dark Moss", "Dusky Moss", "Rich Moss", "Dusky Jade", "Muted Fern", "Dusky Lime"]
trunk = ["Dusky Rust", "Dark Rust", "Muted Ember", "Muted Rust", "Dusky Amber", "Muted Amber", "Dark Amber"]
soil = ["Muted Ember", "Muted Rust", "Dusky Rust", "Muted Amber", "Dark Rust", "Muted Crimson"]
sand = ["Faded Gold", "Pale Gold", "Light Gold", "Faded Amber", "Light Amber", "Pale Amber", "Faded Rust"]
gravel = ["Stone", "Fog", "Pewter", "Silver", "Muted Amber", "Muted Cobalt"]
stone = ["Stone", "Pewter", "Fog", "Iron", "Muted Cobalt", "Muted Violet", "Muted Azure", "Muted Amber"]
deep_stone = ["Iron", "Smoke", "Ash", "Pewter", "Muted Violet", "Muted Cobalt"]
snow = ["Snow", "Bone", "Pearl", "Misty Azure", "Misty Sky", "Misty Cobalt"]

