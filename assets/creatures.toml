# Milestone 13 part 2.

# Boundless's hopper: tier 3 worlds and up; passive until triggered, then
# whistles at least 1.5 s and explodes on impact (impulse); can curl into a
# ball that cannot be hurt; hammers stun it (Release 188). Explosion 400,
# x2.5 at tier 2, x5 at tier 3 (players, 2023); tiers 4 and 5, radius,
