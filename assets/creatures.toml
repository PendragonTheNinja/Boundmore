# Creatures (milestone 13, docs/milestones/13-creatures-and-combat.md).
# Boundless's creatures in Boundmore's own names and models. Health, armour,
# XP and drops per tier are Boundless's (tuning 3.2.2 and 3.2.4; elemental
# shards are left out until elemental creatures exist). Speeds, ranges,
# attack timing and damage past what players measured are GUESSES, listed in
# docs/feel.md for Nathan to check in game.
#
#   behaviour   herd (charges when hurt) | ranged (shoots) | flee (runs away)
#   attack      what it fights with (bm-core creatures::Attack)
#   half_width, height   body, in blocks
#   walk_speed, run_speed   blocks a second
#   notice      notices players this close
#   give_up, forget   leaves a target this far away, or unseen this many s
#   spawn_weight, group   how often a spawn picks it, and how many together
#   [[creature.tiers]]   tier 1 up: health, armour, xp, damage (one hit),
#               drops_min..drops_max rolls on the pool, each entry
#               { item, weight, max } giving 1 to max

# Boundless's wildstock. Charge numbers from Release 172 (speed 12, range 15,
# radius 1.8); base hit 100, x2.5 at tier 2 (players, 2023). Damage above
# tier 2, speeds and ranges: guesses.
