# Grapples: Boundless's final numbers (docs/research/boundless-tuning.md
# 1.1). Its silver, gold, titanium, gem and exotic grapples wait for those
# materials. No base grapple reels itself: in Boundless that is a forge boon.

[[item]]
name = "copper_grapple"
stack = 1
grapple = { range = 10.0, shot_speed = 45.0, reel_in = 5.0, reel_out = 15.0, durability = 500 }

[[item]]
name = "iron_grapple"
stack = 1
grapple = { range = 20.0, shot_speed = 30.0, reel_in = 2.0, reel_out = 10.0, durability = 1000 }

# Portals (ADR-0009).

[[item]]
name = "wayshard"

# Made at a portal, used up linking another of the same size; its tag is the
# portal it was made at.
[[item]]
name = "portal_token"
stack = 1
portal_token = true

# Starter tools (Boundless's numbers, tuning 2.1): the hand stone is crafted
# from nothing, as Boundless's starter tool was, and breaks anything at full
# damage; wood tools come before stone.

[[item]]
name = "hand_stone"
stack = 1
tool = { damage = 200, action_speed = 20.0, durability = 400 }

[[item]]
name = "wood_hammer"
stack = 1
tool = { class = "hammer", damage = 300, action_speed = 20.0, durability = 600 }

[[item]]
name = "wood_shovel"
stack = 1
