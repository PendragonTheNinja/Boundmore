# Items that are not blocks. Every placeable block in blocks.toml is an item
# already, under the same name. Sent to clients in the handshake.
#
#   name      unique; recipes and block `drops` refer to it
#   display   what players see (default: the name in title case)
#   stack     most per slot (default 100; tools must be 1)
#   tool      { class = hammer | shovel | axe, speed, durability }
#             speed: how many times faster than a bare hand on the materials
#             its class suits (hammer: rock, crystal; shovel: soil; axe: wood, plant)
#   chisel    { family = square | slope | bevel | round, precise, durability }
#             cuts blocks into shapes (ADR-0008); precise cuts one eighth of
#             a block at a time, otherwise an edge's two
#   grapple   { range, shot_speed, reel_in, reel_out, hookshot, durability }
#             fires a hook that sticks where it strikes; range is how far
#             it flies and the longest rope (blocks), shot_speed how fast it
#             flies, reel_in and reel_out the rope's top speeds (blocks per
#             second); a hookshot reels in by itself
#   icon      texture in assets/textures/items/ (default: the name)

[[item]]
name = "coal"

[[item]]
name = "copper_ore"

[[item]]
name = "copper_ingot"

[[item]]
name = "iron_ore"

[[item]]
name = "iron_ingot"

[[item]]
name = "stone_hammer"
stack = 1
tool = { class = "hammer", speed = 2.5, durability = 150 }

[[item]]
name = "stone_shovel"
stack = 1
tool = { class = "shovel", speed = 2.5, durability = 150 }

[[item]]
name = "stone_axe"
stack = 1
tool = { class = "axe", speed = 2.5, durability = 150 }

[[item]]
name = "copper_hammer"
stack = 1
tool = { class = "hammer", speed = 4.0, durability = 400 }

[[item]]
name = "copper_shovel"
stack = 1
tool = { class = "shovel", speed = 4.0, durability = 400 }

[[item]]
name = "copper_axe"
stack = 1
tool = { class = "axe", speed = 4.0, durability = 400 }

[[item]]
name = "iron_hammer"
stack = 1
tool = { class = "hammer", speed = 6.0, durability = 900 }

[[item]]
name = "iron_shovel"
stack = 1
tool = { class = "shovel", speed = 6.0, durability = 900 }

[[item]]
name = "iron_axe"
stack = 1
tool = { class = "axe", speed = 6.0, durability = 900 }

[[item]]
name = "square_chisel"
stack = 1
chisel = { family = "square", durability = 300 }

[[item]]
name = "slope_chisel"
stack = 1
chisel = { family = "slope", durability = 400 }

[[item]]
name = "bevel_chisel"
stack = 1
chisel = { family = "bevel", durability = 600 }

[[item]]
name = "round_chisel"
stack = 1
chisel = { family = "round", durability = 600 }

[[item]]
name = "precise_square_chisel"
stack = 1
chisel = { family = "square", precise = true, durability = 600 }

[[item]]
name = "precise_slope_chisel"
stack = 1
chisel = { family = "slope", precise = true, durability = 600 }

# Grapples: Boundless's final numbers (docs/research/boundless-tuning.md
# 1.1). Its silver, gold, titanium, gem and exotic grapples wait for those
# materials. No base grapple reels itself: in Boundless that is a forge boon.

[[item]]
name = "copper_grapple"
stack = 1
grapple = { range = 10.0, shot_speed = 45.0, reel_in = 5.0, reel_out = 15.0, durability = 500 }

[[item]]
name = "iron_grapple"
stack = 1
grapple = { range = 20.0, shot_speed = 30.0, reel_in = 2.0, reel_out = 10.0, durability = 1000 }

# Portals (ADR-0009).

[[item]]
name = "wayshard"

# Made at a portal, used up linking another of the same size; its tag is the
# portal it was made at.
[[item]]
name = "portal_token"
stack = 1
portal_token = true
