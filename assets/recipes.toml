# Recipes. Items by name. `station` is hand (instant, the default; a crafting
# table offers these too), crafting_table, workbench, extractor or furnace
# (queued there, `seconds` per craft). Furnace recipes burn `heat` from the
# furnace's fuel.
#
# Milestone 11: Boundless's recipes up to iron, single craft, from the
# decoded recipe data (docs/milestones/11-crafting-chain.md). Glue is 2 sap
# until creatures bring bone (Nathan, 2026-10-20).

# By hand.
