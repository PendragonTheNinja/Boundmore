# Recipes. Items by name. `station` is hand (instant, the default; a crafting
# table offers these too), crafting_table, workbench, extractor or furnace
# (queued there, `seconds` per craft). Furnace recipes burn `heat` from the
# furnace's fuel. `xp` is the craft XP per craft and `skill` the crafting
# level it needs (Boundless's data; milestone 12). `spark` is drawn from the
# machine's spark grid per craft and `wear` put on the machine (milestone 15;
# only the workbench, extractor, mixer, refinery and compactor wear). Wear
# comes from the wiki's recipe boxes where it has one (copper 7, iron 11,
# extractor 14, sackcloth 6, bomb charge 9, machines 29); the rest follow
# that pattern and are guesses.
#
# Milestone 11: Boundless's recipes up to iron, single craft, from the
# decoded recipe data (docs/milestones/11-crafting-chain.md). Glue was 2 sap
# until creatures brought bone (milestone 13): now 1 sap + 1 bone, as in
# Boundless.

