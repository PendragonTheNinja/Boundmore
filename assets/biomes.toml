# Biomes (milestone 19, docs/milestones/19-living-worlds.md). The catalogue a
# new planet draws its biomes from: Boundless's structure (research
# docs/research/boundless-worldgen.md), Boundmore's own land. A planet copies
# the biomes it draws into its saved settings, so edits here only reach new
# planets.
#
#   set         tier set 1 (gentle) to 7 (wild): a planet of tier t draws most
#               from set t - 1 (sets 1 for tiers 1 and 2), as Boundless did
#   labels      what a planet kind's biome choice filters on
#   climate     targets 0 to 1: altitude, temperature, humidity, vegetation
#   weight      how strongly it claims cells near its climate (0.5 to 1)
#   base        floor of the land, blocks above (or below) the sea
#   hills, hill_size          rolling hills: amplitude and feature size
#   mountains, mountain_size  ridged mountains: height and feature size
#   terrace     land rises in flat steps this tall (0: smooth)
#   rivers      rivers may cut it (default true)
#   cover       [top, under] pairs patched by noise; turf and soils stop on
#               slopes steeper than 1 in 1 (Boundless 1.25), showing the rock
#   rock        the rock it is filled with (bands of the others cross it)
#   cliff, beach  top of steep ground (default: its rock); shore (default sand)
#   snow_above  snow tops land this far above the sea
#   tree_density  chance a column grows a tree where the forest noise allows
#   trees       [{ shape, weight, size 0 to 1, trunk, leaves, leaves2 }]: the
#               shapes (bm-worldgen trees.rs) it grows; wood defaults to the
#               shape's own (biomes.rs default_wood)
# Sizes and densities are GUESSES calibrated by eye (docs/feel.md).

