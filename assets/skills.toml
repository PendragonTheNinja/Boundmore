# The skill tree (milestone 12): Boundless's live tree (1.0 to Release 248,
# docs/research/boundless-tuning.md 5.4), in Boundmore's own names. Saves keep
# spent ranks by `id`, so ids never change.
#
#   id        unique and stable
#   name      what players see
#   category  attributes (level 1) | mastery (2) | crafting (4) | epic1 (6) |
#             endurance (8) | epic2 (10) | exploration (12) | epic3 (14)
#   ranks     most ranks; cost: points per rank (epics 5)
#   effect    what it does (bm-core `skills::Effect`); "later": on the tree
#             but not built yet, cannot be bought
#   text      one rank's effect in plain words
#   excludes  skills that cannot share its page (Boundless's either/or)

