# Copy to server.toml to change the defaults. Every field is optional.
bind = "0.0.0.0:7777"
data_dir = "data"
# Every planet shares one height; 12 chunks (384 blocks) is the minimum.
height_chunks = 12
view_radius = 10
max_players = 200
reach = 7.0
plot_allowance = 64
# Blocks around each warp shrine nobody may change.
shrine_guard = 4
# Index into the list below of the planet new players start on.
start_planet = 0

# The universe. A planet's id is its place in this list: add new planets at
# the end, never reorder or remove one. `kind` is a kind in
# assets/planets.toml. Seed and width are used only when the planet is first
# created; afterwards the saved planet's own settings win.
[[planets]]
name = "Verdance"
kind = "temperate"
seed = 20261018
width_chunks = 64

[[planets]]
name = "Emberdune"
kind = "arid"
seed = 20261019
width_chunks = 48

[[planets]]
name = "Rimehold"
kind = "frozen"
seed = 20261020
width_chunks = 48

[[planets]]
name = "Wildmere"
kind = "lush"
seed = 20261021
width_chunks = 64
